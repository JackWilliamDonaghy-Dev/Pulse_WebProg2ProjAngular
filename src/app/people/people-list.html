<header class="page-heading">
  <div>
    <p class="eyebrow">Relationship tracker</p>
    <h1>People</h1>
    <p class="muted">Make time for the people you want to stay in touch with.</p>
  </div>
  <a matButton="filled" routerLink="/people/new">Add person</a>
</header>
@if (loading()) {
  <p role="status">Loading people…</p>
} @else if (error()) {
  <p role="alert" class="error">{{ error() }}</p>
  <button matButton="outlined" type="button" (click)="load()">Try again</button>
} @else if (!people().length) {
  <p class="empty">There are no contacts yet.</p>
} @else {
  <div class="card-grid">
    @for (person of people(); track person._id) {
      <app-person-card [person]="person" />
    }
  </div>
}
